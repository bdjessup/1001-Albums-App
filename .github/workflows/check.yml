name: Check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Typecheck, test and lint
        run: bun run check
      - name: Bundle iOS and Android
        run: bunx expo export --platform ios --platform android --output-dir dist-check
        env:
          EXPO_OFFLINE: "1"
